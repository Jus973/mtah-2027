[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mtah"
version = "0.1.0"
description = "More Than A Hack 2027 — ball possession from automatic tracking"
requires-python = ">=3.11,<3.12"
license = {text = "MIT"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
