# Shared constants and M0 thresholds. Every threshold lives here (CLAUDE.md).
# Candidate configs (v1_rules.yaml, ...) start with `inherit: base.yaml` and override keys.

# Smart Tagging Team values -> side. Strings as published in DATA.md (sic: "Atletic").
tag_team_map:
  Barcelona: H
  Atletic Club: A

kickoff:
  # Search window around each "Kick Off (Start)" tag, seconds before tag start / after tag end.
  search_before_s: 10.0
  search_after_s: 10.0
  # Line-up: per team, at least this fraction of visible players in their own half (the two
  # kick-takers stand on the halfway line, so 1.0 is unattainable), with this tolerance.
  own_half_frac: 0.8
  own_half_tol_m: 1.0
  gap_fill_frames: 5          # bridge brief dropouts in the line-up mask
  min_formation_frames: 25    # a line-up lasts at least 1 s
  # Ball refinement around the formation break.
  ball_search_before_s: 3.0
  ball_search_after_s: 1.0
  loose_radius_m: 5.0         # "near the centre" given ~1-3 m tracking offset/jitter at the spot
  rest_slack_m: 1.0           # within this of the closest approach = still at the resting spot
  # Acceptance: derived kick-off within this many frames of the published one (1 s).
  tolerance_frames: 25

direction:
  # Frames after each half's kick-off used to estimate attacking direction from team centroids.
  window_frames: 125

bands:  # PLAN.md §6.3, over graded frames
  spells: [280, 550]
  frac_lt_2s: [0.10, 0.30]
  frac_lt_6s: [0.35, 0.60]
  mean_spell_s: [7.0, 16.0]
  d_runs: [60, 150]
  home_share_alive: [0.55, 0.72]
  max_x_frac: 0.02

public_check:  # PLAN.md §6.4: the public window is a pass/fail bug check, never a score
  floor: 0.35          # spellF1 below this = a bug or a wrong owner hypothesis (debug on the sim)
  broken_below: 0.05   # spellF1 below this = team sign inverted or frames misaligned

# Published facts used ONLY as assertions on derived values (never as pipeline inputs).
published:
  n_frames: 199319
  ball_present_all: 113488
  ball_present_graded: 94214
  mean_objects_graded: 20.5
  kickoff_frames: {1: 11185, 2: 113742}
  kickoff_team: {1: A, 2: H}
  home_tag_club: Barcelona

stability:  # PLAN.md §6.2c, scripts/stability.py: label-free self-consistency of a candidate
  perturb_frac: 0.1         # each threshold moved by -/+ this fraction, one at a time
  min_spell: 0.5            # "spells shift wholesale": under half the spells survive a 10% change
  seeds: [1, 2]             # learned components retrained with these seeds
  params: [ball.max_interp_gap, ball.outside_m, ball.v_max_mps, touch.r_touch_m, touch.min_frames,
           touch.min_turn_deg, touch.min_dv_mps, owner.contact_r_m, owner.alpha,
           deadball.oob_margin_m, deadball.oob_min_frames, deadball.gap_min_frames,
           deadball.merge_frames, kickoff.tolerance_frames]

disagreement:  # PLAN.md §6.5, scripts/disagreement.py (debugging only)
  candidates: [v1, v2, v3]
  min_frames: 5             # shorter disagreement runs are not worth a clip

sync:  # PLAN.md M2 T3, scripts/sync_stats.py: broadcast -> tactical from audio
  features: [band_db, log_rms]   # whistle-band energy (sharp shared events) and loudness
  highpass_frames: 125      # remove the slow loudness trend (5 s)
  window_frames: 1500       # 60 s broadcast windows ...
  hop_frames: 750           # ... every 30 s
  exclude_frames: 50        # the second peak must be this far from the first
  min_score: 0.3            # confident window: peak correlation ...
  min_ratio: 1.5            # ... and peak / second peak
  cluster_tol_frames: 2     # windows within this offset are one live segment
  min_cluster_windows: 2
  tol_m: 2.0                # PLAN.md acceptance: balls agree within 2 m ...
  accept: 0.9               # ... on >= 90% of the frames where both feeds see it
  pointset:                 # fallback: sync on the two feeds' ball tracks (sync/pointset.py)
    step_frames: 25         # coarse search over every lag at 1 fps, then refined
    min_frames: 250         # a window needs this many frames with both balls seen
    max_median_m: 2.0       # synced window: median ball distance at the best lag
    main_offsets: 2         # live segments are tested at the largest clusters' offsets
    min_both: 25            # a segment needs this many frames with both balls to be judged

whistle:  # PLAN.md M2 T3, audio/whistle.py and scripts/whistle_stats.py
  min_tonality: 40.0        # 2-4.5 kHz peak-to-mean power (match q95 ~ 27; a pure tone ~ 100)
  min_band_db_over_median: 10.0
  min_frames: 3             # >= 120 ms
  window_s: 1.0             # PLAN.md: a whistle within 1 s ...
  gate: 0.7                 # ... of >= 70% of the anchors, else no whistle cue

clipviewer:  # PLAN.md §6.5, scripts/clip_export.py + tools/clipviewer/ (humans, debugging only)
  configs: {v1: rules.yaml, v2: rules_v2.yaml, v3: final.yaml}
  min_frames: 5
  pad_s: 2.0
  max_clips: 300
