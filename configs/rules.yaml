# Rules v1: ball cleaning, touch detection and owner hypotheses (PLAN.md M1).
# Tuned on the sim's fit matches only (scripts/sim_rules.py); the held-out sim matches pick the
# hypothesis; the public window is a pass/fail bug check and tunes nothing.
inherit: sim.yaml

ball:
  outside_m: 10.0           # positions farther than this outside the pitch are dropped
  v_max_mps: 40.0           # one-frame steps faster than this are dropped
  max_interp_gap: 10        # gaps up to this many frames are filled linearly

# Tuned by make sim-rules on the 5 fit matches (31 Oct), D from the sim GT. Held-out spellF1:
# H1 0.606, H2 0.585 (configs/rules_h2.yaml), H3 0.504; smooth50 + oracle D 0.403.
touch:
  r_touch_m: 1.0            # a player within this of the ball = contact
  bridge_frames: 2          # contact gaps this short (same nearest team) stay one episode
  min_frames: 12            # an episode is a touch if the ball stays close this long ...
  min_turn_deg: 20          # ... or turns this much ...
  min_dv_mps: 12.0          # ... or changes speed this much
  min_launch_mps: 99.0      # ... or leaves this fast from rest or from unseen (v1: off)
  rest_mps: 1.0             #     "rest" = slower than this before the episode
  kin_offset_frames: 3      # velocity measured this many frames before / after the episode

owner:
  # H1 wins both held-out matches and is the simplest rule (PLAN.md §6.4). Caveat: DFL's
  # possession flips on touches more readily than the real GT, which favours H1; re-check H1 vs
  # H2 with label-free checks on the real match once dead-ball v1 exists.
  decoder: rules            # rules (decode/rules.py, owner.hypothesis) or viterbi (rules_v3.yaml)
  hypothesis: H1
  n_c: 2                    # H2 only: controlled if the ball stays close >= n_c frames,
  v_c_mps: 1.0              #     or is slower than this after the touch,
  t_c_s: 0.25               #     or the next touch is the same team's within t_c seconds

# Tuned by make sim-dead on the 5 fit matches (31 Oct), owner rule H1, end-to-end spellF1.
# Held-out: 0.541 with detected D (oracle D 0.606; official baseline 0.286). Ablation on held-out:
# gap alone 0.534, oob alone 0.445, still alone 0.435, oob+still 0.454. Stillness adds nothing on
# the sim even without gaps (v_still sits at its grid's low end: effectively off).
deadball:
  oob_margin_m: 0.5         # observed ball this far beyond a line = out of play
  oob_min_frames: 15
  gap_min_frames: 25        # ball missing at least this long = a stoppage (real gaps: < 26 or > 100)
  gap_offset_frames: 0
  gap_v_players_mps: 99.0   # gap frames count only while players' mean speed is below this (v1: off)
  gap_speed_window_frames: 25
  gap_calm_min_frames: 1
  speed_window_frames: 25
  v_still_mps: 0.05         # ball slower than this ...
  v_players_mps: 1.0        # ... and players' mean speed below this ...
  still_min_frames: 75      # ... for at least this long = a stoppage
  merge_frames: 50          # evidence runs this close are one stoppage
  restart_window_frames: null  # release restarts: a touch started inside the evidence, ending
                            #   at most this many frames before it ends (v1: off)
  restart_flight_mps: 99.0  # flight restarts: the ball reappears this fast after a gap (v1: off)

# Smart Tagging <-> tracking alignment (PLAN.md M1), label-free: make airlock T=dead-stats on the
# real match, 31 Oct. Set-piece tags are fixed 35 s windows; the predicted restart (dead-ball v1
# D run end) falls 9.48 s after the tag start (IQR 6.0-13.2 s, 57 tags). Not used by v1 yet.
tags:
  set_piece_restart_after_start_s: 9.48
